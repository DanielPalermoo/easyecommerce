spring:
  datasource:
    url: ${DB_NAME:jdbc:postgresql://localhost:5432/easyecommerce?options=-c%20timezone=UTC}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:CAMBIAR_POR_PASSWORD_SEGURA}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      data-locations: classpath:import.sql
      continue-on-error: true

  output:
    ansi:
      enabled: always

  application:
    name: easyecommerce

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:
    expiration-minutes: 30
